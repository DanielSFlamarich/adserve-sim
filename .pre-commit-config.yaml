repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
  - repo: local
    hooks:
      - id: path-header
        name: first line must be the file's path
        entry: >
          bash -c 'fail=0; for f in "$@"; do
          [ "$(head -1 "$f")" = "# $f" ] || { echo "$f: line 1 should be \"# $f\""; fail=1; };
          done; exit $fail' --
        language: system
        types: [ python ]
